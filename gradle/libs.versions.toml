[versions]
# AGP 9.1.0+ is not a preference — every current AndroidX artifact (compose
# 1.12, core 1.19, lifecycle 2.11) hard-requires it and refuses to build
# against compileSdk 36. Staying on AGP 8 would mean pinning the whole AndroidX
# surface a year back.
agp = "9.3.1"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"

composeBom = "2026.08.00"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.9.8"

room = "2.8.4"
coroutines = "1.11.0"
serializationJson = "1.11.0"

# 1.4.1 rejects AGP 9 application modules outright ("Module `:app` is not a
# supported android module"). 1.5.0-rc01 is the first line that recognises them.
benchmark = "1.5.0-rc01"


# FR-APP-04's gate delegates to the OS rather than storing a secret of its own,
# which is what NFR-SEC-05's reasoning already implies. 1.1.0 is the stable line
# and the first with `setAllowedAuthenticators`; the alphas add nothing needed here.
biometric = "1.1.0"

# Not a preference, and not optional: it fixes a crash in shipped code.
#
# `androidx.biometric:1.1.0` resolves `androidx.fragment` to **1.2.5**, whose
# `FragmentActivity.startActivityForResult` still multiplexes a fragment index
# into the upper 16 bits of the request code and rejects anything that does not
# fit. `ActivityResultRegistry` allocates request codes from 0x10000 upwards, so
# *every* `rememberLauncherForActivityResult` launch from a `FragmentActivity`
# throws `IllegalArgumentException: Can only use lower 16 bits for requestCode`.
#
# MainActivity became a `FragmentActivity` for FR-APP-04's biometric gate
# (§20.3), and that silently broke every document picker in the app: FR-DAT-01,
# FR-DAT-02, FR-DAT-03 and the recovery screen's raw copy. §21.7 has the
# reasoning and how it went unnoticed.
#
# Fragment 1.3.0 removed the override; this is the current stable line.
fragment = "1.8.9"

junit = "4.13.2"
testRunner = "1.7.0"
testExtJunit = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version = "1.4.1" }

androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
# No org.jetbrains.kotlin.android entry: AGP 9 supplies Kotlin itself. The
# `kotlin` version below must match the Kotlin that AGP bundles (9.3.1 → 2.2.10)
# so the Compose and serialization compiler plugins load against the same
# compiler.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
