# R8 full mode over the Compose runtime needs real headroom; the daemon died at
# 2 GB while shrinking the release build.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# 04-system-architecture.md §10 — R8 full mode is mandatory, not optional.
android.enableR8.fullMode=true

kotlin.code.style=official

# AGP 9's built-in Kotlin rejects contributions to `kotlin.sourceSets`, but the
# KSP Gradle plugin still registers its generated sources that way
# (google/ksp#2729). This is AGP's own documented suppression for the overlap.
# Room is the only processor here; revisit once KSP registers through
# android.sourceSets.
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
